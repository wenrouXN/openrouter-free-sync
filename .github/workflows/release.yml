name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: false

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: so,    zig: x86_64-linux-gnu }
          - { goos: linux,   goarch: arm64, ext: so,    zig: aarch64-linux-gnu }
          - { goos: darwin,  goarch: amd64, ext: dylib, zig: x86_64-macos }
          - { goos: darwin,  goarch: arm64, ext: dylib, zig: aarch64-macos }
          - { goos: windows, goarch: amd64, ext: dll,   zig: x86_64-windows-gnu }
          - { goos: windows, goarch: arm64, ext: dll,   zig: aarch64-windows-gnu }
          - { goos: freebsd, goarch: amd64, ext: so,    zig: x86_64-freebsd }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # zig cc as universal cross C compiler for CGO
      - uses: mlugg/setup-zig@v1
        with:
          version: '0.13.0'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CC: zig cc -target ${{ matrix.zig }}
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          [ -n "$VERSION" ] || VERSION="0.0.0-dev"
          mkdir -p dist
          OUT="dist/openrouter-free-sync_${VERSION}_${GOOS}_${GOARCH}.${{ matrix.ext }}"
          go build -trimpath -buildmode=c-shared -buildvcs=false -ldflags="-s -w" -o "$OUT" .
          ls -la "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-free-sync-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
