name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: so
          - goos: linux
            goarch: arm64
            ext: so
          - goos: darwin
            goarch: amd64
            ext: dylib
          - goos: darwin
            goarch: arm64
            ext: dylib
          - goos: windows
            goarch: amd64
            ext: dll
          - goos: windows
            goarch: arm64
            ext: dll
          - goos: freebsd
            goarch: amd64
            ext: so
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install cross-compilation toolchain
        if: matrix.goarch == 'arm64' && matrix.goos != 'darwin'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          mkdir -p dist
          PLUGIN_ID=openrouter-free-sync
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          # strip leading 'v' from tag
          VERSION=${VERSION#v}
          OUTPUT="dist/${PLUGIN_ID}_${VERSION}_${GOOS}_${GOARCH}.${{ matrix.ext }}"
          go build -trimpath -buildmode=c-shared -ldflags="-s -w" -o "$OUTPUT" .
          ls -la "$OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-free-sync-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
